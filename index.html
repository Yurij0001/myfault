<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casinò Sanremo – Cedolino Ufficiale</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Canvas Confetti per la vittoria -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #08080a;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --card-bg: rgba(18, 18, 22, 0.85);
            --border-gold: rgba(212, 175, 55, 0.4);
            --text-main: #f1f1f5;
            --text-muted: #9494a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(170, 124, 17, 0.06) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 30px 20px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
        }

        /* Profilo & Logo al Centro con sfondo giallo-oro ad alto contrasto */
        .profile-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .profile-center img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-light);
            background: linear-gradient(135deg, #f3e5ab, #d4af37);
            padding: 4px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .profile-center .name-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .profile-center .badge-sub {
            font-size: 0.8rem;
            color: var(--gold-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid var(--border-gold);
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(212, 175, 55, 0.05);
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }

        .game-box {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        input[type="number"] {
            background: rgba(8, 8, 10, 0.9);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--gold-light);
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            width: 220px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
        }

        button {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
        }

        .message-box {
            margin-top: 15px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.5);
            border-left: 3px solid var(--gold-primary);
            border-radius: 0 12px 12px 0;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
            animation: fadeIn 0.4s ease-out;
        }

        .stats {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sezioni Intermedie di Vittoria / Domanda */
        .victory-section {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.6s ease-out;
        }

        .victory-section h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .photo-frame {
            width: 100%;
            max-width: 340px;
            margin: 0 auto 20px auto;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--gold-primary);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.25);
        }

        .photo-frame img {
            width: 100%;
            border-radius: 10px;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-frame img:hover {
            transform: scale(1.02);
        }

        /* Modale Schermo Intero per lo Zoom */
        .image-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 8, 10, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            cursor: zoom-out;
            animation: fadeIn 0.3s ease-out;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
            object-fit: contain;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-yes {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
        }

        .btn-no {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
        }

        /* Animazioni Fluttuanti di Soldi e Stelle */
        .floating-effects {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
            display: none;
        }

        .float-item {
            position: absolute;
            font-size: 2rem;
            animation: floatUpAndFade 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes floatUpAndFade {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.4); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }
            .input-group {
                flex-direction: column;
            }
            input[type="number"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Contenitore effetti visivi temporanei (Stelle e Soldi) -->
    <div class="floating-effects" id="floatingEffects"></div>

    <!-- Modale Schermo Intero per lo Zoom dell'immagine -->
    <div class="image-modal" id="imageModal" onclick="closeModal()">
        <img id="modalImage" src="" alt="Zoom Immagine">
    </div>

    <div class="container">
        <!-- Logo Profilo e Nome al Centro -->
        <div class="profile-center">
            <img src="profilo_yuri.svg" alt="Logo Yuri Cantone">
            <div class="name-title">Yuri Cantone</div>
            <div class="badge-sub">Cedolino &bull; Casinò Sanremo</div>
        </div>

        <h1>Verifica Compenso</h1>
        <p class="subtitle">Indovina la combinazione esatta per sbloccare e visualizzare il cedolino ufficiale con il tuo guadagno</p>

        <div class="game-box" id="gameArea">
            <div class="input-group">
                <input type="number" id="userGuess" placeholder="Tuo importo" autofocus>
                <button onclick="checkGuess()">Verifica</button>
            </div>
            
            <div class="message-box" id="messageBox">
                Inserisci una cifra per verificare il cedolino...
            </div>

            <div class="stats" id="statsDisplay">
                Tentativi effettuati: 0
            </div>
        </div>

        <!-- Fase 1: Mostra foto1.jpeg e fa la domanda -->
        <div class="victory-section" id="victorySection">
            <h2 id="questionTitle">🎉 Combinazione Esatta! Vuoi vedere il cedolino?</h2>
            <div class="photo-frame">
                <img src="foto1.jpeg" alt="Screen di Verifica" onclick="openModal(this.src)">
            </div>
            <div class="btn-group" id="answerButtons">
                <button class="btn-yes" onclick="answerYes()">Sì</button>
                <button class="btn-no" onclick="answerNo()">No</button>
            </div>
        </div>
    </div>

    <script>
        const target = 1620;
        let attempts = 0;

        const lowMessages = {
            close: [
                "Ci sei quasi vicino, manca pochissimo per il tuo cedolino pieno!",
                "Un soffio e ci sei! Non mollare proprio adesso sulla linea di arrivo.",
                "Quasi in vetta! Allunga un altro pochino le dita.",
                "Stai camminando sul cornicione giusto, ancora un millimetro!",
                "Manca l'ultimo gradino della scala mobile, dai che ci sei!",
                "Profumo di vittoria nell'aria, manca solo una manciata di spiccioli.",
                "Cifra caldissima! Un piccolo ritocco verso l'alto e hai fatto bingo.",
                "Ci balla sopra una monetina da due centesimi, sali ancora un filo!",
                "Sei lì che bussi alla porta del caveau, aprila con stile!",
                "Manca talmente poco che quasi sento frusciare le banconote."
            ],
            medium: [
                "Caldo, caldo... ma con questa cifra non paghi nemmeno le tasse!",
                "Ti manca ancora la mancetta della nonna per arrivare alla somma vera!",
                "Ma che mi dai che sono così povero? Alza decisamente il tiro!",
                "Stai salendo bene, ma il direttore di banca ti rimanderebbe a casa.",
                "Non ci siamo ancora, con questi fondi compri giusto un pacchetto di figurine.",
                "Mancano un bel po' di zeri di spessore, dai una scossa al conto!",
                "Siamo sulla buona strada ma il portafoglio piange ancora un po'.",
                "Così mi fai sembrare un impiegato part-time in crisi di liquidità!",
                "Dai un'accelerata ai cavalli del motore, siamo ancora troppo bassi.",
                "Un buon tentativo, ma il tuo conto merita di molto meglio!"
            ],
            far: [
                "Con questa cifra non ci compri neanche un caffè al bar del corso!",
                "Siamo ai limiti dell'elemosina digitale, sveglia il caveau!",
                "Numeri da vero pezzente... dai, fai uno sforzo di classe!",
                "Con questi soldi scarsi ti compri giusto una caramella gommosa usata.",
                "Se continui così mi toccherà aprire una raccolta fondi per beneficenza.",
                "Questa cifra offende la dignità del Casinò di Sanremo!",
                "Manco per un biglietto della lotteria di paese basterebbe questo importo.",
                "Ma sei serio? Stai offrendo noccioline a un re!",
                "Qui siamo a livelli di economia domestica di un robottino scarico.",
                "Sveglia! Questo importo fa ridere anche i polli del pollaio."
            ]
        };

        const highMessages = {
            close: [
                "Stai esagerando di un soffio, abbassa leggermente l'asticella!",
                "Altissimo! Sei salito troppo in alto, scendi di un micro-millimetro!",
                "Frenata brusca! Hai superato la quota di pochissimo, scala una marcia.",
                "Quasi perfetto, ma sei andato oltre il budget autorizzato!",
                "Hai sbirciato troppo in alto, torna giù di un centesimo.",
                "Troppo ambizioso per questo round, scendi di un battito di ciglia.",
                "Attento che ti viene il mal di montagna, sei a un soffio dalla vetta ma sopra!",
                "Leggermente fuorigiri, alleggerisci il carico di un nonnulla.",
                "Sei salito sul tetto del grattacielo, rimetti i piedi sul pavimento!",
                "Meno uno! Anzi, meno pochissimo, hai tirato troppo la corda."
            ],
            medium: [
                "Accidenti, hai fatto un investimento da magnate ma hai esagerato!",
                "Sei lassù nell'alta atmosfera, scendi un attimo sulla Terra compatta!",
                "Manco fossi un emiro arabo in vena di spese folli, datti una calmata!",
                "Così mi mandi in bancarotta totale in un secondo flat!",
                "Hai sparato una cifra da sceicco di Dubai, ridimensiona le pretese.",
                "Il direttore finanziario ti sta già correndo dietro con la scopa!",
                "Stai volando troppo vicino al sole con ali di cera, riduci la quota.",
                "Troppo sfarzo tutto in una volta, fai marcia indietro!",
                "Manco avessi vinto il jackpot di Las Vegas alla prima giocata.",
                "Ridimensiona il miliardario che c'è in te, siamo sopra budget!"
            ],
            far: [
                "Manco fossi il re di spade, hai sparato una cifra stratosferica!",
                "Numeri da capogiro intergalattico, stai volando troppo alto nello spazio!",
                "Stai gestendo il PIL di una nazione intera, datti una regolata!",
                "Nemmeno Elon Musk guadagna così tanto in un millisecondo!",
                "Cifra folle e galattica, hai rotto tutti i contatori del Casinò!",
                "Stai quotando in borsa l'intero pianeta Terra, scendi sul serio!",
                "Fermati! Stai stampando moneta falsa a livelli industriali.",
                "Qui non siamo a Sanremo, qui stai comprando l'intera galassia di Andromeda!",
                "Numeri da fantascienza pura, il sistema è in tilt per l'eccesso di ricchezza!",
                "Ma dove le prendi queste cifre? Nemmeno i banchieri più pazzi arrivano a tanto!"
            ]
        };

        function getRandomMessage(category, tier) {
            const arr = category[tier];
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getIronicalMessage(diff) {
            const absDiff = Math.abs(diff);
            const isLow = diff < 0;

            if (absDiff <= 30) {
                return getRandomMessage(isLow ? lowMessages : highMessages, 'close');
            } else if (absDiff <= 150) {
                return getRandomMessage(isLow ? lowMessages : highMessages, 'medium');
            } else {
                return getRandomMessage(isLow ? lowMessages : highMessages, 'far');
            }
        }

        function checkGuess() {
            const inputEl = document.getElementById('userGuess');
            const messageBox = document.getElementById('messageBox');
            const statsDisplay = document.getElementById('statsDisplay');
            const guess = parseInt(inputEl.value);

            if (isNaN(guess)) {
                messageBox.innerHTML = "Per favore, inserisci un numero valido nel sistema.";
                return;
            }

            attempts++;
            statsDisplay.innerHTML = `Tentativi effettuati: ${attempts}`;

            if (guess === target) {
                document.getElementById('gameArea').style.display = 'none';
                document.getElementById('victorySection').style.display = 'block';
                return;
            }

            const diff = guess - target;
            messageBox.innerHTML = getIronicalMessage(diff);
            inputEl.value = '';
            inputEl.focus();
        }

        function answerNo() {
            document.getElementById('questionTitle').innerHTML = "Va bene, allora niente, me lo tengo per me! 🔒";
            document.getElementById('answerButtons').style.display = 'none';
        }

        function answerYes() {
            triggerMoneyAndStars();

            setTimeout(() => {
                document.getElementById('questionTitle').innerHTML = "📜 Ecco il tuo cedolino ufficiale! 📜";
                const frameImg = document.querySelector('.photo-frame img');
                frameImg.src = "foto2.jpeg"; 
                document.getElementById('answerButtons').style.display = 'none';

                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#d4af37', '#f3e5ab', '#aa7c11', '#ffffff']
                });
            }, 800);
        }

        // Funzioni per gestire lo zoom a schermo intero
        function openModal(src) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
        }

        function triggerMoneyAndStars() {
            const container = document.getElementById('floatingEffects');
            container.style.display = 'block';
            container.innerHTML = '';

            const symbols = ['⭐', '🌟', '💰', '💵', '💶', '$', '✨'];
            
            for (let i = 0; i < 25; i++) {
                const el = document.createElement('div');
                el.className = 'float-item';
                el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                
                el.style.left = Math.random() * 80 + 10 + '%';
                el.style.top = Math.random() * 60 + 20 + '%';
                el.style.animationDelay = (Math.random() * 0.4) + 's';
                el.style.animationDuration = (Math.random() * 1 + 1.2) + 's';
                
                container.appendChild(el);
            }

            setTimeout(() => {
                container.style.display = 'none';
                container.innerHTML = '';
            }, 2500);
        }

        document.getElementById('userGuess').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkGuess();
            }
        });
    </script>
</body>
</html>
